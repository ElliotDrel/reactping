# Replace YOUR_SITE_HOST with the host of PUBLIC_SITE_URL (for example reactping.vercel.app), then paste into
# https://api.slack.com/apps -> your app -> App Manifest (or Create New App -> From a manifest).
# Unlisted public distribution is enabled for workspace pilots. This setting is managed in Slack,
# not this manifest; Marketplace submission is separate.
display_information:
  name: ReactPing
  description: Bot DMs when someone reacts to your messages.
features:
  bot_user:
    display_name: ReactPing
    always_online: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    # ReactPing doesn't read DMs; feedback goes through the website form linked in the welcome DM and Home tab.
    messages_tab_read_only_enabled: true
oauth_config:
  redirect_urls:
    - https://YOUR_SITE_HOST/api/slack/oauth/callback
  scopes:
    user:
      - reactions:read
    bot:
      - chat:write
settings:
  event_subscriptions:
    request_url: https://YOUR_SITE_HOST/api/slack/events
    user_events:
      - reaction_added
    bot_events:
      - app_home_opened
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://YOUR_SITE_HOST/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
