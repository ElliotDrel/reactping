name: IndexNow

# Vercel deploys main on push but sends no GitHub deployment events for this repo,
# so wait for the new site to go live, then submit the sitemap.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "src/app/**", "CHANGELOG.md"]

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Wait for the Vercel production deploy
        if: github.event_name == 'push'
        run: sleep 150
      - run: node scripts/submit-indexnow.mjs
