name: IndexNow

# Vercel deploys main on push but sends no GitHub deployment events for this repo,
# so wait for the new site to go live, then submit the sitemap.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**"]

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the Vercel production deploy
        if: github.event_name == 'push'
        run: sleep 150
      - run: node scripts/submit-indexnow.mjs
