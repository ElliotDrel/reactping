# Hourly outage check. A failed run means DMs are failing or Slack stopped sending reaction events; GitHub emails
# the repo owner. See GET /api/health in docs/setup.md.
name: health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check https://reactping.com/api/health
        run: |
          code=$(curl -sS --retry 2 -o body.json -w '%{http_code}' https://reactping.com/api/health)
          cat body.json; echo
          test "$code" = 200
