name: Release

# Every merge to main deploys to production, so whatever sits under [Unreleased] in CHANGELOG.md is already live.
# This turns it into the next version (scripts/release.mjs), commits that, and tags it, so the changelog and tags
# never lag behind production. Pushes made with GITHUB_TOKEN don't trigger workflows, so the release commit can't loop.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release [Unreleased] if it has entries
        run: |
          version=$(node scripts/release.mjs)
          if [ -z "$version" ]; then echo "Nothing to release."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
