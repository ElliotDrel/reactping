name: Check

# Runs the same `npm run check` contributors run locally, including the Postgres suites,
# so formatting, type, lint, build, and test failures block a PR instead of slipping through.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A branch cut before a release can auto-merge its entries into the released section without a conflict.
      - name: Keep released changelog sections unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:CHANGELOG.md > "$RUNNER_TEMP/base-changelog.md"
          node scripts/release.mjs --verify "$RUNNER_TEMP/base-changelog.md"
      - run: npm run check
